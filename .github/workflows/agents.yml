# Unattended agent stages (docs/decisions/0019). Runs after the weekly pipeline (validate ->
# macro (one shared note per sector group, #140) -> research -> pm (the portfolio manager: the
# week's allocation and rotations, ADR 0027) -> retro (each desk area due one reviews its own
# track record and proposes changes, ADR 0035) -> plan.py -> weekly_pack.py) and after the daily check (monitor, postmortem of
# positions closed since the previous daily run), or by hand. On Friday's daily run the monitor
# reviews every open position and pending entry (the weekly review, docs/decisions/0039);
# midweek only those with news (a filing, a gap, a kill criterion hit), and it may only cut risk
# (event-triggered first, capped by max_agent_tickers). Its changes are applied by the book as
# they are recorded; the inbox says what to change in Trading212 and how to undo it. Nothing to
# review: no monitor job. The risk manager reports the book's VaR / CVaR and P&L to the desk
# thread (the owner's Telegram) on Friday, or on any day the risk card breaches a limit, and the
# PM reviews the book when a limit is breached or the risk manager calls it, cutting risk as
# recorded (ADR 0036, 0039).
#
# Skipped when the triggering workflow did not succeed (a crashed scan leaves a partial run).
# INERT UNTIL THE OWNER ADDS A CLAUDE SECRET: the gate job skips everything unless
# CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY is set, and SOLARA_TURSO_URL / SOLARA_TURSO_TOKEN
# are set (the agents read the run from the hosted DB and write back to it). No spend happens
# otherwise. Cost guardrails: a ticker cap (config/portfolio.toml max_agent_tickers, taken in
# rank order), --max-turns per invocation and a job timeout. A failed skill invocation is
# recorded as an ERROR verdict and the run carries on; the job fails only if every item errored.
# Each invocation's cost and runtime go to the agent_runs table (record.py usage, #139).
name: Agents

on:
  workflow_run:
    workflows: ["Weekly pipeline", "Daily check"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: weekly (validate, research, plan, pack) or daily (monitor, postmortem)
        type: choice
        options: [weekly, daily]
        default: weekly
      run_id:
        description: results-DB run id; blank = the latest scan / daily run
        default: ""

concurrency:
  group: book
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  MAX_TURNS: 60
  # who places orders (ADR 0031): the execution job, once it has both keys and trading names the
  # account (as its own gate needs; `off` or a mismatch leaves it to the owner)
  SOLARA_ORDERS_BY: ${{ (secrets.SOLARA_T212_KEY != '' && secrets.SOLARA_T212_SECRET != '' && (vars.SOLARA_T212_TRADING || 'demo') == (vars.SOLARA_T212_ENV || 'demo')) && 'system' || 'owner' }}
  # Tools the skills need (and no more: the agents read the web, so a prompt injection must not
  # reach code or the book): the scripts the skills name, files written only under
  # data/processed/ (the packs and verdicts), and the web for research. No bare Read / Grep: they
  # would reach outside the repo (the environment, with its secrets); reads and greps inside the
  # repo need no permission. A value model in config/value_models.toml adds its script here.
  # Edit(/data/...) is anchored at the repo root: a bare `data/...` is relative to the shell's
  # current directory, which moves when an agent `cd`s (HSP.L's verdict write was refused, run 14).
  ALLOWED_TOOLS: >-
    Bash(uv run python scripts/announcement.py *),Bash(uv run --no-sync python scripts/announcement.py *),Bash(uv run python scripts/chat.py *),Bash(uv run --no-sync python scripts/chat.py *),Bash(uv run python scripts/events.py *),Bash(uv run --no-sync python scripts/events.py *),Bash(uv run python scripts/jet2_value.py *),Bash(uv run --no-sync python scripts/jet2_value.py *),Bash(uv run python scripts/monitor_pack.py *),Bash(uv run --no-sync python scripts/monitor_pack.py *),Bash(uv run python scripts/pm_pack.py *),Bash(uv run --no-sync python scripts/pm_pack.py *),Bash(uv run python scripts/postmortem_pack.py *),Bash(uv run --no-sync python scripts/postmortem_pack.py *),Bash(uv run python scripts/record.py *),Bash(uv run python scripts/risk_pack.py *),Bash(uv run --no-sync python scripts/risk_pack.py *),Bash(uv run python scripts/track_record.py *),Bash(uv run --no-sync python scripts/track_record.py *),Bash(uv run --no-sync python scripts/record.py *),Bash(uv run python scripts/validate_pack.py *),Bash(uv run --no-sync python scripts/validate_pack.py *),Bash(uv run python scripts/plan.py --dry-run *),Bash(uv run --no-sync python scripts/plan.py --dry-run *),Edit(/data/processed/**),Glob,WebSearch,WebFetch
  # The desk thread's Telegram mirror (ADR 0033); unset, the agents still post to the DB thread.
  SOLARA_TELEGRAM_TOKEN: ${{ secrets.SOLARA_TELEGRAM_TOKEN }}
  SOLARA_TELEGRAM_CHAT: ${{ secrets.SOLARA_TELEGRAM_CHAT }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      go: ${{ steps.run.outputs.skip == 'true' && 'false' || steps.gate.outputs.go }}
      mode: ${{ steps.mode.outputs.mode }}
      run: ${{ steps.run.outputs.run }}
      validate: ${{ steps.queue.outputs.validate }}
      monitor: ${{ steps.queue.outputs.monitor }}
      risk: ${{ steps.queue.outputs.risk }}
      postmortem: ${{ steps.queue.outputs.postmortem }}
    steps:
      - id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "agents skipped: ${{ github.event.workflow_run.name }} did not succeed (${{ github.event.workflow_run.conclusion }})" >> "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif { [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; } || [ -z "$SOLARA_TURSO_URL" ] || [ -z "$SOLARA_TURSO_TOKEN" ]; then
            echo "agents skipped: secrets not configured (need CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY, and SOLARA_TURSO_URL / SOLARA_TURSO_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.workflow_run.name }}" = "Daily check" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: astral-sh/setup-uv@v3
        if: steps.gate.outputs.go == 'true'
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
        if: steps.gate.outputs.go == 'true'
      - id: run
        if: steps.gate.outputs.go == 'true'
        env:
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            run="${{ inputs.run_id }}"
          elif [ "${{ steps.mode.outputs.mode }}" = "daily" ]; then
            run=$(uv run --no-sync python scripts/record.py latest-run --script daily)
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # the full weekly scan this pipeline run saved; none (a one-stock or subset run):
            # no weekly agents, rather than re-running them on an older scan
            set +e
            run=$(uv run --no-sync python scripts/record.py latest-run --script scan --since "${{ github.event.workflow_run.run_started_at }}")
            rc=$?
            set -e
            if [ "$rc" = "3" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "agents skipped: the pipeline run saved no full weekly scan" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            elif [ "$rc" != "0" ]; then exit "$rc"; fi
          else
            run=$(uv run --no-sync python scripts/record.py latest-run --script scan)
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "agents: mode ${{ steps.mode.outputs.mode }}, run $run" >> "$GITHUB_STEP_SUMMARY"
      - id: queue
        if: steps.gate.outputs.go == 'true' && steps.run.outputs.skip != 'true'
        env:
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: |
          run="${{ steps.run.outputs.run }}"
          if [ "${{ steps.mode.outputs.mode }}" = "daily" ]; then
            echo "monitor=$(uv run --no-sync python scripts/record.py queue --run "$run" --stage monitor | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
            echo "postmortem=$(uv run --no-sync python scripts/record.py queue --run "$run" --stage postmortem | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
            echo "risk=$(uv run --no-sync python scripts/record.py queue --run "$run" --stage risk | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
            echo "validate=[]" >> "$GITHUB_OUTPUT"
          else
            echo "validate=$(uv run --no-sync python scripts/record.py queue --run "$run" --stage validate | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
            echo "monitor=[]" >> "$GITHUB_OUTPUT"
            echo "risk=[]" >> "$GITHUB_OUTPUT"
            echo "postmortem=[]" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'weekly' && needs.gate.outputs.validate != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ticker: ${{ fromJson(needs.gate.outputs.validate) }}
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - id: agent
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}  # the action otherwise wants an OIDC token (id-token: write)
          prompt: "/validate ${{ matrix.ticker }} --run ${{ needs.gate.outputs.run }}"
          claude_args: '--max-turns ${{ env.MAX_TURNS }} --allowedTools "${{ env.ALLOWED_TOOLS }}"'
      - name: Record agent usage
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py usage --run "${{ needs.gate.outputs.run }}"
          --ticker "${{ matrix.ticker }}" --stage validate
          --file "${{ steps.agent.outputs.execution_file }}"
          --status "${{ steps.agent.outcome == 'success' && 'success' || 'failure' }}" || true
      - name: ERROR if the agent failed or ended without recording a verdict
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py error "${{ matrix.ticker }}"
          --run "${{ needs.gate.outputs.run }}" --stage validate --if-missing
          --reason "${{ steps.agent.outcome == 'failure' && 'claude-code-action failed or hit the turn limit' || 'the agent ended without recording a verdict' }} (job ${{ github.run_id }})" || true
      - uses: actions/upload-artifact@v4  # the agent's transcript, to see why it failed
        if: always() && steps.agent.outputs.execution_file != ''
        with:
          name: transcript-validate-${{ strategy.job-index }}
          path: ${{ steps.agent.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 14

  macro-groups:
    needs: [gate, validate]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'weekly' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      groups: ${{ steps.queue.outputs.groups }}
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - id: queue
        run: echo "groups=$(uv run --no-sync python scripts/record.py queue --run "${{ needs.gate.outputs.run }}" --stage macro | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  macro:
    needs: [gate, macro-groups]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'weekly' && needs.macro-groups.result == 'success' && needs.macro-groups.outputs.groups != '[]' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.macro-groups.outputs.groups) }}
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - id: agent
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}  # the action otherwise wants an OIDC token (id-token: write)
          prompt: "/macro --run ${{ needs.gate.outputs.run }} for the group ${{ matrix.group }} only"
          claude_args: '--max-turns ${{ env.MAX_TURNS }} --allowedTools "${{ env.ALLOWED_TOOLS }}"'
      - name: Record agent usage
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py usage --run "${{ needs.gate.outputs.run }}"
          --ticker "${{ matrix.group }}" --stage macro
          --file "${{ steps.agent.outputs.execution_file }}"
          --status "${{ steps.agent.outcome == 'success' && 'success' || 'failure' }}" || true
      - name: ERROR if the agent failed or ended without recording a verdict
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py error "${{ matrix.group }}"
          --run "${{ needs.gate.outputs.run }}" --stage macro --if-missing
          --reason "${{ steps.agent.outcome == 'failure' && 'claude-code-action failed or hit the turn limit' || 'the agent ended without recording a verdict' }} (job ${{ github.run_id }})" || true
      - uses: actions/upload-artifact@v4  # the agent's transcript, to see why it failed
        if: always() && steps.agent.outputs.execution_file != ''
        with:
          name: transcript-macro-${{ strategy.job-index }}
          path: ${{ steps.agent.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 14

  research:
    needs: [gate, validate, macro]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'weekly' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tickers: ${{ steps.queue.outputs.tickers }}
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - run: uv run --no-sync python scripts/record.py outcome --run "${{ needs.gate.outputs.run }}" --stage validate >> "$GITHUB_STEP_SUMMARY" || true
      - id: queue
        run: echo "tickers=$(uv run --no-sync python scripts/record.py queue --run "${{ needs.gate.outputs.run }}" --stage research | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  research-agents:
    needs: [gate, research]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'weekly' && needs.research.result == 'success' && needs.research.outputs.tickers != '[]' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ticker: ${{ fromJson(needs.research.outputs.tickers) }}
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - id: agent
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}  # the action otherwise wants an OIDC token (id-token: write)
          prompt: "/research ${{ matrix.ticker }} --run ${{ needs.gate.outputs.run }}"
          claude_args: '--max-turns ${{ env.MAX_TURNS }} --allowedTools "${{ env.ALLOWED_TOOLS }}"'
      - name: Record agent usage
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py usage --run "${{ needs.gate.outputs.run }}"
          --ticker "${{ matrix.ticker }}" --stage research
          --file "${{ steps.agent.outputs.execution_file }}"
          --status "${{ steps.agent.outcome == 'success' && 'success' || 'failure' }}" || true
      - name: ERROR if the agent failed or ended without recording a verdict
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py error "${{ matrix.ticker }}"
          --run "${{ needs.gate.outputs.run }}" --stage research --if-missing
          --reason "${{ steps.agent.outcome == 'failure' && 'claude-code-action failed or hit the turn limit' || 'the agent ended without recording a verdict' }} (job ${{ github.run_id }})" || true
      - uses: actions/upload-artifact@v4  # the agent's transcript, to see why it failed
        if: always() && steps.agent.outputs.execution_file != ''
        with:
          name: transcript-research-${{ strategy.job-index }}
          path: ${{ steps.agent.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 14

  pm:
    # the portfolio manager: one invocation over the whole book (ADR 0027); its allocation and
    # rotations are recorded before plan.py, which follows them and needs no owner approval
    needs: [gate, research, research-agents]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'weekly' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the pack's `changes` card reads the git log since the previous scan
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - id: agent
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}  # the action otherwise wants an OIDC token (id-token: write)
          prompt: "/pm --run ${{ needs.gate.outputs.run }}"
          claude_args: '--max-turns ${{ env.MAX_TURNS }} --allowedTools "${{ env.ALLOWED_TOOLS }}"'
      - name: Record agent usage
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py usage --run "${{ needs.gate.outputs.run }}"
          --ticker _BOOK --stage pm
          --file "${{ steps.agent.outputs.execution_file }}"
          --status "${{ steps.agent.outcome == 'success' && 'success' || 'failure' }}" || true
      - name: ERROR if the agent failed or ended without recording a verdict (plans then wait for the owner)
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py error _BOOK
          --run "${{ needs.gate.outputs.run }}" --stage pm --if-missing
          --reason "${{ steps.agent.outcome == 'failure' && 'claude-code-action failed or hit the turn limit' || 'the agent ended without recording a verdict' }} (job ${{ github.run_id }})" || true
      - uses: actions/upload-artifact@v4  # the agent's transcript, to see why it failed
        if: always() && steps.agent.outputs.execution_file != ''
        with:
          name: transcript-pm
          path: ${{ steps.agent.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 14

  retro-areas:
    needs: [gate, pm]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'weekly' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      areas: ${{ steps.queue.outputs.areas }}
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - id: queue
        run: echo "areas=$(uv run --no-sync python scripts/record.py queue --run "${{ needs.gate.outputs.run }}" --stage retro | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  retro:
    needs: [gate, retro-areas]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'weekly' && needs.retro-areas.result == 'success' && needs.retro-areas.outputs.areas != '[]' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJson(needs.retro-areas.outputs.areas) }}
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - id: agent
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}  # the action otherwise wants an OIDC token (id-token: write)
          prompt: "/retro ${{ matrix.area }} --run ${{ needs.gate.outputs.run }}"
          claude_args: '--max-turns ${{ env.MAX_TURNS }} --allowedTools "${{ env.ALLOWED_TOOLS }}"'
      - name: Record agent usage
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py usage --run "${{ needs.gate.outputs.run }}"
          --ticker "${{ matrix.area }}" --stage retro
          --file "${{ steps.agent.outputs.execution_file }}"
          --status "${{ steps.agent.outcome == 'success' && 'success' || 'failure' }}" || true
      - name: ERROR if the agent failed or ended without recording a verdict
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py error "${{ matrix.area }}"
          --run "${{ needs.gate.outputs.run }}" --stage retro --if-missing
          --reason "${{ steps.agent.outcome == 'failure' && 'claude-code-action failed or hit the turn limit' || 'the agent ended without recording a verdict' }} (job ${{ github.run_id }})" || true
      - uses: actions/upload-artifact@v4  # the agent's transcript, to see why it failed
        if: always() && steps.agent.outputs.execution_file != ''
        with:
          name: transcript-retro-${{ strategy.job-index }}
          path: ${{ steps.agent.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 14

  plan:
    needs: [gate, research, research-agents, pm, retro]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'weekly' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - run: uv run --no-sync python scripts/record.py outcome --run "${{ needs.gate.outputs.run }}" --stage research >> "$GITHUB_STEP_SUMMARY" || true
      - run: uv run --no-sync python scripts/plan.py --run "${{ needs.gate.outputs.run }}"
      - run: uv run --no-sync python scripts/weekly_pack.py --run "${{ needs.gate.outputs.run }}" --report "$GITHUB_STEP_SUMMARY"
      - name: Notify the owner of the week's plans (GitHub inbox issue)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          uv run --no-sync python scripts/notify.py --mode weekly --run "${{ needs.gate.outputs.run }}" --summary-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --channel github-issue
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "nothing to notify" >> "$GITHUB_STEP_SUMMARY"; elif [ "$rc" != "0" ]; then exit "$rc"; fi
      - name: Desk errors (agents failures of the run, ADR 0032)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: |
          set +e
          uv run --no-sync python scripts/notify.py --mode errors --part agents --run "${{ needs.gate.outputs.run }}" --channel github-errors
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "no desk errors" >> "$GITHUB_STEP_SUMMARY"; elif [ "$rc" != "0" ]; then exit "$rc"; fi
      - name: Fail only if every agent errored
        run: |
          uv run --no-sync python scripts/record.py outcome --run "${{ needs.gate.outputs.run }}" --stage validate
          uv run --no-sync python scripts/record.py outcome --run "${{ needs.gate.outputs.run }}" --stage research
          uv run --no-sync python scripts/record.py outcome --run "${{ needs.gate.outputs.run }}" --stage pm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agents-${{ github.run_id }}
          path: data/
          if-no-files-found: ignore
          retention-days: 90

  monitor:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'daily' && needs.gate.outputs.monitor != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        position: ${{ fromJson(needs.gate.outputs.monitor) }}
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - id: agent
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}  # the action otherwise wants an OIDC token (id-token: write)
          prompt: "/monitor --run ${{ needs.gate.outputs.run }} --position ${{ matrix.position }}"
          claude_args: '--max-turns ${{ env.MAX_TURNS }} --allowedTools "${{ env.ALLOWED_TOOLS }}"'
      - name: Record agent usage
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py usage --run "${{ needs.gate.outputs.run }}"
          --ticker "position-${{ matrix.position }}" --stage monitor
          --file "${{ steps.agent.outputs.execution_file }}"
          --status "${{ steps.agent.outcome == 'success' && 'success' || 'failure' }}" || true
      - if: steps.agent.outcome == 'failure'
        run: |
          ticker=$(uv run --no-sync python -c "from solaraalpha.portfolio import book; c = book.connect(); print(book.position_state(c, ${{ matrix.position }}).ticker)")
          uv run --no-sync python scripts/record.py error "$ticker" --run "${{ needs.gate.outputs.run }}" --stage monitor --if-missing \
            --reason "claude-code-action failed or hit the turn limit (job ${{ github.run_id }}, position ${{ matrix.position }})" || true

  postmortem:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'daily' && needs.gate.outputs.postmortem != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        position: ${{ fromJson(needs.gate.outputs.postmortem) }}
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - id: agent
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}  # the action otherwise wants an OIDC token (id-token: write)
          prompt: "/postmortem ${{ matrix.position }}"
          claude_args: '--max-turns ${{ env.MAX_TURNS }} --allowedTools "${{ env.ALLOWED_TOOLS }}"'
      - name: Record agent usage
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py usage --run "${{ needs.gate.outputs.run }}"
          --ticker "position-${{ matrix.position }}" --stage postmortem
          --file "${{ steps.agent.outputs.execution_file }}"
          --status "${{ steps.agent.outcome == 'success' && 'success' || 'failure' }}" || true
      - if: steps.agent.outcome == 'failure'
        run: |
          ticker=$(uv run --no-sync python -c "from solaraalpha.portfolio import book; c = book.connect(); print(book.position_state(c, ${{ matrix.position }}).ticker)")
          uv run --no-sync python scripts/record.py error "$ticker" --run "${{ needs.gate.outputs.run }}" --stage postmortem --if-missing \
            --position "${{ matrix.position }}" \
            --reason "claude-code-action failed or hit the turn limit (job ${{ github.run_id }}, position ${{ matrix.position }})" || true

  risk:
    # the risk manager's report (ADR 0036): after the monitors, on the code's risk card, on
    # Friday's weekly review or a day the card breaches a limit (record.py queue --stage risk,
    # ADR 0039); posts the report to the desk thread (the owner's Telegram) and may call the PM
    needs: [gate, monitor]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'daily' && needs.gate.outputs.risk != '[]' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - id: card
        run: |
          set +e
          uv run --no-sync python scripts/risk_pack.py --run "${{ needs.gate.outputs.run }}" > /dev/null
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; elif [ "$rc" = "3" ]; then echo "no risk card in this run" >> "$GITHUB_STEP_SUMMARY"; else exit "$rc"; fi
      - id: agent
        if: steps.card.outputs.has == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}  # the action otherwise wants an OIDC token (id-token: write)
          prompt: "/risk --run ${{ needs.gate.outputs.run }}"
          claude_args: '--max-turns ${{ env.MAX_TURNS }} --allowedTools "${{ env.ALLOWED_TOOLS }}"'
      - name: Record agent usage
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py usage --run "${{ needs.gate.outputs.run }}"
          --ticker _BOOK --stage risk
          --file "${{ steps.agent.outputs.execution_file }}"
          --status "${{ steps.agent.outcome == 'success' && 'success' || 'failure' }}" || true
      - name: ERROR if the agent failed or ended without recording a verdict
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py error _BOOK
          --run "${{ needs.gate.outputs.run }}" --stage risk --if-missing
          --reason "${{ steps.agent.outcome == 'failure' && 'claude-code-action failed or hit the turn limit' || 'the agent ended without recording a verdict' }} (job ${{ github.run_id }})" || true
      - uses: actions/upload-artifact@v4  # the agent's transcript, to see why it failed
        if: always() && steps.agent.outputs.execution_file != ''
        with:
          name: transcript-risk
          path: ${{ steps.agent.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 14

  pm-daily:
    # the PM's daily review, only when the risk card breaches a limit or the risk manager called
    # it (record.py called; ADR 0036): risk-reducing actions, applied as recorded
    needs: [gate, risk]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'daily' && needs.risk.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - id: called
        run: |
          set +e
          uv run --no-sync python scripts/record.py called --run "${{ needs.gate.outputs.run }}" | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = "0" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; elif [ "$rc" != "3" ]; then exit "$rc"; fi
      - id: agent
        if: steps.called.outputs.go == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}  # the action otherwise wants an OIDC token (id-token: write)
          prompt: "/pm-daily --run ${{ needs.gate.outputs.run }}"
          claude_args: '--max-turns ${{ env.MAX_TURNS }} --allowedTools "${{ env.ALLOWED_TOOLS }}"'
      - name: Record agent usage
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py usage --run "${{ needs.gate.outputs.run }}"
          --ticker _BOOK --stage pm_daily
          --file "${{ steps.agent.outputs.execution_file }}"
          --status "${{ steps.agent.outcome == 'success' && 'success' || 'failure' }}" || true
      - name: ERROR if the agent failed or ended without recording a verdict
        if: always() && steps.agent.outcome != 'skipped'
        run: >
          uv run --no-sync python scripts/record.py error _BOOK
          --run "${{ needs.gate.outputs.run }}" --stage pm_daily --if-missing --actor agent:pm
          --reason "${{ steps.agent.outcome == 'failure' && 'claude-code-action failed or hit the turn limit' || 'the agent ended without recording a verdict' }} (job ${{ github.run_id }})" || true
      - uses: actions/upload-artifact@v4  # the agent's transcript, to see why it failed
        if: always() && steps.agent.outputs.execution_file != ''
        with:
          name: transcript-pm-daily
          path: ${{ steps.agent.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 14

  monitor-outcome:
    needs: [gate, monitor, postmortem, risk, pm-daily]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.mode == 'daily' && (needs.gate.outputs.monitor != '[]' || needs.gate.outputs.postmortem != '[]' || needs.gate.outputs.risk != '[]') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
      SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - run: uv run --no-sync python scripts/record.py outcome --run "${{ needs.gate.outputs.run }}" --stage monitor | tee -a "$GITHUB_STEP_SUMMARY" || true
      - run: uv run --no-sync python scripts/record.py outcome --run "${{ needs.gate.outputs.run }}" --stage postmortem | tee -a "$GITHUB_STEP_SUMMARY" || true
      - run: uv run --no-sync python scripts/record.py outcome --run "${{ needs.gate.outputs.run }}" --stage risk | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Notify the owner of plan changes applied, revision proposals and errors (GitHub inbox issue)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          uv run --no-sync python scripts/notify.py --mode daily --run "${{ needs.gate.outputs.run }}" --only revisions,errors --channel github-issue
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "nothing to notify" >> "$GITHUB_STEP_SUMMARY"; elif [ "$rc" != "0" ]; then exit "$rc"; fi
      - name: Desk errors (agents failures of the run, ADR 0032)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: |
          set +e
          uv run --no-sync python scripts/notify.py --mode errors --part agents --run "${{ needs.gate.outputs.run }}" --channel github-errors
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "no desk errors" >> "$GITHUB_STEP_SUMMARY"; elif [ "$rc" != "0" ]; then exit "$rc"; fi
      - name: Fail only if every agent errored
        run: |
          uv run --no-sync python scripts/record.py outcome --run "${{ needs.gate.outputs.run }}" --stage monitor
          uv run --no-sync python scripts/record.py outcome --run "${{ needs.gate.outputs.run }}" --stage postmortem
