# Book from GitHub, without a local checkout: one book.py command against the hosted results
# DB (Turso), e.g. `cash deposit 5000 --note "paper start"`, `approve 3`, `tickets`; or re-plan a
# saved run (plan.py `--run 8`, weekly_pack.py `--run 8`). The book view (scripts/portfolio.py)
# follows in the job summary.
name: Book

on:
  workflow_dispatch:
    inputs:
      script:
        description: Script to run
        type: choice
        options: [book.py, plan.py, weekly_pack.py]
        default: book.py
      command:
        description: Arguments, e.g. `--run 8` for plan.py, or for book.py cash deposit 5000 --note "paper start"
        required: true

concurrency:
  group: book  # shared with scan.yml and daily.yml: never write the book at the same time
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - name: ${{ inputs.script }}
        env:
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
          SCRIPT: ${{ inputs.script }}
          COMMAND: ${{ inputs.command }}
        # The input is split by shlex in Python, never interpolated into the shell.
        run: |
          uv run --no-sync python -c 'import os, runpy, shlex, sys
          script = os.environ["SCRIPT"]
          assert script in ("book.py", "plan.py", "weekly_pack.py"), script
          sys.argv = [script, *shlex.split(os.environ["COMMAND"])]
          runpy.run_path(f"scripts/{script}", run_name="__main__")' | tee out.txt
          { echo "### $SCRIPT"; echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Portfolio
        if: always()
        env:
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: |
          uv run --no-sync python scripts/portfolio.py | tee portfolio.txt
          { echo '### Portfolio'; echo '```'; cat portfolio.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
