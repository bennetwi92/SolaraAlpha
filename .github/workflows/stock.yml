# One stock, on demand: a single toolkit with its default verdict, or a whole graph.
name: Run one stock

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Yahoo ticker, e.g. JET2.L
        required: true
      toolkit:
        description: Toolkit id (scripts/scan.py --list); leave blank to run the graph
        default: technical
      graph:
        description: Graph id, used when toolkit is blank
        default: long_swing
      params:
        description: Toolkit params, space-separated key=value (e.g. entry_date=2026-06-05)
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - name: Run
        env:
          TICKER: ${{ inputs.ticker }}
          TOOLKIT: ${{ inputs.toolkit }}
          GRAPH: ${{ inputs.graph }}
          PARAMS: ${{ inputs.params }}
        run: |
          args=("$TICKER" --save --report "$GITHUB_STEP_SUMMARY")
          if [ -n "$TOOLKIT" ]; then
            args+=(--toolkit "$TOOLKIT")
            for p in $PARAMS; do args+=(--param "$p"); done
          else
            args+=(--graph "$GRAPH")
          fi
          uv run --no-sync python scripts/scan.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-${{ github.run_id }}
          path: data/
          if-no-files-found: ignore
          retention-days: 90
