# One stock, on demand: a single toolkit with its default verdict, or the whole pipeline.
name: Run one stock

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Yahoo ticker, e.g. JET2.L
        required: true
      toolkit:
        description: Toolkit id (scripts/scan.py --list); leave blank to run the pipeline
        default: technical
      params:
        description: Toolkit params, space-separated key=value (e.g. entry_date=2026-06-05)
        default: ""

concurrency:
  group: book  # its --save reviews every open position: never beside another writer
  cancel-in-progress: false

permissions:
  contents: write  # db.py push to the db branch (ADR 0041)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - name: Pull the results DB (db branch, ADR 0041)
        id: dbpull
        env:
          SOLARA_DB_KEY: ${{ secrets.SOLARA_DB_KEY }}
        run: uv run --no-sync python scripts/db.py pull
      - name: Run
        env:
          TICKER: ${{ inputs.ticker }}
          TOOLKIT: ${{ inputs.toolkit }}
          PARAMS: ${{ inputs.params }}
        run: |
          args=("$TICKER" --save --report "$GITHUB_STEP_SUMMARY")
          if [ -n "$TOOLKIT" ]; then
            args+=(--toolkit "$TOOLKIT")
            for p in $PARAMS; do args+=(--param "$p"); done
          fi
          uv run --no-sync python scripts/scan.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-${{ github.run_id }}
          path: |
            data/
            !data/solara.db*
          if-no-files-found: ignore
          retention-days: 90
      - name: Push the results DB (even after a failed step, ADR 0041)
        if: always() && steps.dbpull.outcome == 'success'
        env:
          SOLARA_DB_KEY: ${{ secrets.SOLARA_DB_KEY }}
        run: uv run --no-sync python scripts/db.py push --message "$GITHUB_WORKFLOW / $GITHUB_JOB / run $GITHUB_RUN_ID"
