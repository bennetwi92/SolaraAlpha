# Daily check: prices, triggers and new filings for open positions, the watch list and pending
# entries (scripts/daily.py), weekday evenings after the London close; on Friday every open
# position and pending entry gets a daily_review for the monitor agent (the weekly review,
# agents.yml, docs/decisions/0039); midweek the monitor sees only news. Writes a
# `daily` run with the triggers to the results DB (Turso secrets, else the local file) and the
# report to the job summary. Shares the `book` concurrency group with scan.yml so the two never
# write at once (docs/decisions/0017). Posts to the GitHub issue labelled `inbox` only when the
# run needs the owner (docs/decisions/0021).
name: Daily check

on:
  schedule:
    - cron: "47 17 * * 1-5"  # 17:47 UTC: after the 16:35 London close in GMT and BST
  workflow_dispatch:

concurrency:
  group: book
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  # who places orders (ADR 0031): the execution job, once it has both keys and trading names the
  # account (as its own gate needs; `off` or a mismatch leaves it to the owner)
  SOLARA_ORDERS_BY: ${{ (secrets.SOLARA_T212_KEY != '' && secrets.SOLARA_T212_SECRET != '' && (vars.SOLARA_T212_TRADING || 'demo') == (vars.SOLARA_T212_ENV || 'demo')) && 'system' || 'owner' }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - name: Daily check
        env:
          SOLARA_TELEGRAM_TOKEN: ${{ secrets.SOLARA_TELEGRAM_TOKEN }}
          SOLARA_TELEGRAM_CHAT: ${{ secrets.SOLARA_TELEGRAM_CHAT }}
          SOLARA_T212_KEY: ${{ secrets.SOLARA_T212_KEY }}
          SOLARA_T212_SECRET: ${{ secrets.SOLARA_T212_SECRET }}
          SOLARA_T212_ENV: ${{ vars.SOLARA_T212_ENV || 'demo' }}
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: uv run --no-sync python scripts/daily.py --save --report "$GITHUB_STEP_SUMMARY" --run-id-file run_id.txt
      - name: Notify the owner (GitHub inbox issue) only when something needs them
        if: always() && hashFiles('run_id.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: |
          set +e
          uv run --no-sync python scripts/notify.py --mode daily --run "$(cat run_id.txt)" --channel github-issue
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "nothing to notify" >> "$GITHUB_STEP_SUMMARY"; elif [ "$rc" != "0" ]; then exit "$rc"; fi
      - name: Desk errors (pipeline failures of the run, ADR 0032)
        if: always() && hashFiles('run_id.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: |
          set +e
          uv run --no-sync python scripts/notify.py --mode errors --part pipeline --run "$(cat run_id.txt)" --channel github-errors
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "no desk errors" >> "$GITHUB_STEP_SUMMARY"; elif [ "$rc" != "0" ]; then exit "$rc"; fi
      - name: Dashboard
        if: always()
        env:
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: uv run --no-sync python scripts/dashboard.py --out data/processed/dashboard.html || echo "dashboard failed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-${{ github.run_id }}
          path: data/processed/dashboard.html
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-${{ github.run_id }}
          path: data/
          if-no-files-found: ignore
          retention-days: 30
