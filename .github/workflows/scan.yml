# Weekly scan: every universe in config/universes runs its dependency graph (scripts/scan.py).
# Results go to the job summary; the results DB and event packs are kept as an artifact
# until the hosted DB exists (docs/decisions/0007, 0008).
name: Weekly scan

on:
  schedule:
    - cron: "17 6 * * 6"  # Saturday 06:17 UTC: Friday's weekly bar is complete
  workflow_dispatch:
    inputs:
      universe:
        description: Universe id (config/universes/<id>.toml), or "all"
        default: all

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - name: Scan
        env:
          UNIVERSE: ${{ inputs.universe || 'all' }}
        run: >
          uv run --no-sync python scripts/scan.py --universe "$UNIVERSE"
          --save --report "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ github.run_id }}
          path: data/
          if-no-files-found: ignore
          retention-days: 90
