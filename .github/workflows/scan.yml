# Weekly pipeline: every stock in config/watchlist.toml through the stages in
# solaraalpha.pipeline (scripts/scan.py), one stage at a time. Results go to the job summary
# and the hosted results DB (Turso, from the SOLARA_TURSO_* secrets; without them, the local
# data/solara.db), then the weekly pack for the saved run (scripts/weekly_pack.py) is appended
# to the summary. data/ (event packs, packs/) is kept as an artifact (docs/decisions/0007,
# 0010, 0013, 0014, 0015).
name: Weekly pipeline

on:
  schedule:
    - cron: "17 18 * * 0"  # Sunday 18:17 UTC: after Friday's close, before Monday's open
  workflow_dispatch:
    inputs:
      tickers:
        description: Space-separated Yahoo tickers; blank = the watchlist
        default: ""

concurrency:
  group: book  # shared with daily.yml: never write the book at the same time
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - name: Pipeline
        env:
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
          TICKERS: ${{ inputs.tickers }}
        run: >
          uv run --no-sync python scripts/scan.py $TICKERS
          --save --report "$GITHUB_STEP_SUMMARY" --run-id-file run_id.txt
      - name: Weekly pack
        if: always()
        env:
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: |
          if [ -s run_id.txt ]; then
            uv run --no-sync python scripts/weekly_pack.py --run "$(cat run_id.txt)" --report "$GITHUB_STEP_SUMMARY"
          else
            echo "no saved run: weekly pack skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Notify the owner (GitHub inbox issue) only when something needs them
        if: always() && hashFiles('run_id.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
          HAS_AGENTS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
          SCAN_OK: ${{ job.status == 'success' }}
        run: |
          # with the agents configured, the weekly message goes out after they draft the plans
          # (agents.yml plan job); here only when they will not run
          if [ "$HAS_AGENTS" = "true" ] && [ "$SCAN_OK" = "true" ]; then
            echo "weekly message: sent after the agents' plans (agents.yml)" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          set +e
          uv run --no-sync python scripts/notify.py --mode weekly --run "$(cat run_id.txt)" --summary-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --channel github-issue
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "nothing to notify" >> "$GITHUB_STEP_SUMMARY"; elif [ "$rc" != "0" ]; then exit "$rc"; fi
      - name: Dashboard
        if: always()
        env:
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
        run: uv run --no-sync python scripts/dashboard.py --out data/processed/dashboard.html || echo "dashboard failed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-${{ github.run_id }}
          path: data/processed/dashboard.html
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ github.run_id }}
          path: data/
          if-no-files-found: ignore
          retention-days: 90
