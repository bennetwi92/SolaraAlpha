# Weekly pipeline: every stock in config/watchlist.toml through the stages in
# solaraalpha.pipeline (scripts/scan.py), one stage at a time. Results go to the job summary
# and the hosted results DB (Turso, from the SOLARA_TURSO_* secrets; without them, the local
# data/solara.db). data/ (event packs) is kept as an artifact (docs/decisions/0007, 0010, 0013).
name: Weekly pipeline

on:
  schedule:
    - cron: "17 18 * * 0"  # Sunday 18:17 UTC: after Friday's close, before Monday's open
  workflow_dispatch:
    inputs:
      tickers:
        description: Space-separated Yahoo tickers; blank = the watchlist
        default: ""

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --no-default-groups
      - name: Pipeline
        env:
          SOLARA_TURSO_URL: ${{ secrets.SOLARA_TURSO_URL }}
          SOLARA_TURSO_TOKEN: ${{ secrets.SOLARA_TURSO_TOKEN }}
          TICKERS: ${{ inputs.tickers }}
        run: >
          uv run --no-sync python scripts/scan.py $TICKERS
          --save --report "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ github.run_id }}
          path: data/
          if-no-files-found: ignore
          retention-days: 90
