name: solaraalpha
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - gh  # GitHub CLI from conda-forge
  - pip
  - pip:
    - numpy<2.0
    - scipy
    - statsmodels
    - yfinance
    - alpha-vantage
    - fredapi
    - pandas
    - python-dateutil
    - requests
    - pytest
    - pytest-cov
    - pytest-mock
    - pyyaml
    - pyarrow
    - ruff
    - alpaca-py
    - python-dotenv
    - ccxt
    - psutil
