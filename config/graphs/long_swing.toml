# Weekly long-swing scan (2-16 week longs): a technical screen first; only stocks that pass
# get the levels and fundamentals checks, and only those passing both get an event pack for
# the /events agent. A node runs only when every node in `needs` passed.
#
#   [nodes.<id>]          node id; runs the toolkit of the same id unless `toolkit` is set
#   toolkit = "<id>"      registered toolkit (uv run python scripts/scan.py --list)
#   needs   = ["<node>"]  nodes that must pass first
#   params  = { ... }     keyword arguments for the toolkit
#   passes  = ["<field> <op> <value>", ...]  verdict on the toolkit's card (default: the
#                         toolkit's own; [] = passes whenever it runs)
description = "Weekly long-swing scan: technical screen, then levels + fundamentals, then events."

[nodes.technical]
passes = ["trend >= 0.25", "momentum > 0"]

[nodes.levels]
needs = ["technical"]
passes = ["reward_risk >= 2"]

[nodes.fundamentals]
needs = ["technical"]
passes = ["quality > -0.5"]

[nodes.events]
needs = ["levels", "fundamentals"]
