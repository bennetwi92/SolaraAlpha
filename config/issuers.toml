# Issuer identity per stock: Yahoo ticker -> LEI (and GLEIF legal name), so the pipeline finds a
# stock's FCA NSM filings without asking the London Stock Exchange. The LSE instrument endpoint
# (TIDM -> ISIN) answers 403 from cloud runners (CloudFront block, scan run 14, 2026-10-25), and an
# LEI never changes, so it is looked up once and kept here (solaraalpha.data.announcements.
# resolve_issuer reads this first). Resolved 2026-10-25 by name via GLEIF, each LEI checked to
# have NSM filings. New watchlist stocks: `uv run python scripts/issuers.py [--write]`.
#
# ARBB.L: Arbuthnot's NSM filings carry no LEI, so a search by LEI finds none of them.
