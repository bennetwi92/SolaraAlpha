# What each stock is compared against by the relative-strength toolkit
# (solaraalpha.analysis.relative_strength; docs/decisions/0011). Any Yahoo ticker; series in
# another currency are converted to the stock's at weekly FX closes.
#
#   market   — broad index of the stock's home market. Defaults by listing suffix (below).
#   industry — the closest US sector ETF. Optional.
#   peers    — listed companies in the same business. Optional; none chosen yet.
#   sector   — the stock's ICB industry, for concentration limits (portfolio.risk.sector_of).
#              From the ICB Industry column of Wikipedia's "List of Nasdaq-100 companies"
#              (Nasdaq classifies its indices by ICB), copied 2026-11-23 with the watchlist.
#
# Industry: the Select Sector SPDR ETF closest to the stock's ICB industry. The SPDRs follow GICS,
# not ICB, so the match is approximate (ICB Telecommunications -> XLC communication services).
# Refresh both when the watchlist changes. A stock with no entry is compared with its market only.

[market]          # default market index by Yahoo ticker suffix
"" = "^NDX"       # US listings (no suffix): the Nasdaq-100 itself

