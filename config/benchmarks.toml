# What each stock is compared against by the relative-strength toolkit
# (solaraalpha.analysis.relative_strength; docs/decisions/0011). Any Yahoo ticker; series in
# another currency are converted to the stock's at weekly FX closes.
#
#   market   — broad index of the stock's home market. Defaults by listing suffix (below).
#   industry — sector index; if Yahoo has no history for it, the closest sector ETF. Optional.
#   peers    — listed companies in the same business, any exchange. Optional; aim for 4-8.
#   sector   — the stock's ICB sector, for concentration limits (portfolio.risk.sector_of).
#              Optional; a stock without one is "unknown". Set only from a public source, never
#              guessed: the LSE's own classification, the 6-digit ICB `sectorcode` returned by
#              api.londonstockexchange.com/api/gw/lse/instruments/alldata/<TIDM> (the data behind
#              the LSE company page), read 2026-10-17 and named per FTSE Russell ICB.
#
# Industry: the closest sector ETF with 5 years of Yahoo history (UK sector indices have none),
# mostly the iShares STOXX Europe 600 sector ETF for the stock's ICB sector. Peers: listed
# companies in the same business, chosen by hand; every ticker was checked to return Yahoo
# history on 2026-10-17. Refresh both when the watchlist changes.
#
# A stock with no entry is compared with its market only.

[market]          # default market index by Yahoo ticker suffix
".L" = "^FTAS"    # FTSE All-Share: the UK opportunity set (AIM stocks too — see 0011)

[stocks."JET2.L"]
sector = "Travel & Leisure"
